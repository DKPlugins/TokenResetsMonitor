name: Installer acceptance

on:
  workflow_dispatch:
    inputs:
      version:
        description: Published candidate tag to install and upgrade in disposable runners
        required: true
        default: v1.1.0-rc.1
        type: string
      previous_ref:
        description: Previous immutable Git tag to build for installer upgrade and backup rollback
        required: true
        default: v1.0.0
        type: string

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.version }}
      PREVIOUS_REF: ${{ inputs.previous_ref }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate version references
        run: |
          for reference in "$RELEASE_TAG" "$PREVIOUS_REF"; do
            if ! printf '%s\n' "$reference" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$'; then
              echo 'Invalid version reference.' >&2
              exit 2
            fi
          done
          test "$RELEASE_TAG" != "$PREVIOUS_REF"
      - name: Check out the previous version source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.previous_ref }}
          path: previous-source
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: previous-source/go.mod
          cache-dependency-path: previous-source/go.sum
      - name: Build the exact previous source revision
        working-directory: previous-source
        run: |
          mkdir -p "$RUNNER_TEMP/trm-previous"
          module=github.com/DKPlugins/TokenResetsMonitor/internal/buildinfo
          commit=$(git rev-parse HEAD)
          echo "Previous source: $PREVIOUS_REF at $commit (built in this acceptance job)"
          go build -trimpath -ldflags "-X $module.Version=${PREVIOUS_REF#v} -X $module.Commit=$commit" -o "$RUNNER_TEMP/trm-previous/tokenresetsmonitor" ./cmd/tokenresetsmonitor
          "$RUNNER_TEMP/trm-previous/tokenresetsmonitor" version
      - name: Download the published installer
        run: |
          printf '%s\n' "$RELEASE_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$'
          mkdir -p "$RUNNER_TEMP/trm-installer-acceptance"
          gh release download "$RELEASE_TAG" --pattern install.sh --dir "$RUNNER_TEMP/trm-installer-acceptance"
      - name: Reject a tampered release archive
        run: sudo env CI=true sh scripts/test-installer-checksum.sh "$RUNNER_TEMP/trm-installer-acceptance/install.sh" "$RELEASE_TAG"
      - name: Install, upgrade the previous binary, and restore its backup
        run: |
          set -eu
          installer="$RUNNER_TEMP/trm-installer-acceptance/install.sh"
          sudo env TRM_API_BASE_URL=http://127.0.0.1:1/api/v1 sh "$installer" --version "$RELEASE_TAG" --no-start
          # The candidate establishes paths/permissions. Seed configuration with
          # the previous binary: a fresh candidate config has schema 2/new fields.
          sudo env TRM_API_BASE_URL=http://127.0.0.1:1/api/v1 \
            TRM_STATE_PATH=/var/lib/tokenresetsmonitor/state.db TRM_LOGGING_FORMAT=json \
            TRM_LOGGING_FILE_ENABLED=true TRM_LOGGING_DIRECTORY=/var/log/tokenresetsmonitor \
            "$RUNNER_TEMP/trm-previous/tokenresetsmonitor" init --defaults --config "$RUNNER_TEMP/trm-previous/config.yaml"
          sudo install -o root -g tokenresetsmonitor -m 640 "$RUNNER_TEMP/trm-previous/config.yaml" /etc/tokenresetsmonitor/config.yaml
          sudo grep -Eq '^config_version: 1$' /etc/tokenresetsmonitor/config.yaml
          printf '%s\n' 'TRM_UPDATES_ENABLED=false' | sudo tee /etc/tokenresetsmonitor/environment >/dev/null
          sudo chmod 600 /etc/tokenresetsmonitor/environment
          # Only the candidate understands --structural. The old binary below
          # uses ordinary validation against the same legacy configuration.
          sudo tokenresetsmonitor config validate --structural --config /etc/tokenresetsmonitor/config.yaml
          sudo install -m 755 "$RUNNER_TEMP/trm-previous/tokenresetsmonitor" /usr/local/bin/tokenresetsmonitor
          test "$(tokenresetsmonitor version --json | jq -r .version)" = "${PREVIOUS_REF#v}"
          sudo tokenresetsmonitor config validate --config /etc/tokenresetsmonitor/config.yaml
          sudo systemctl start tokenresetsmonitor
          sleep 2
          sudo systemctl is-active --quiet tokenresetsmonitor
          sudo systemctl stop tokenresetsmonitor
          sudo test -s /var/lib/tokenresetsmonitor/state.db
          sudo sha256sum /etc/tokenresetsmonitor/config.yaml /var/lib/tokenresetsmonitor/state.db | tee "$RUNNER_TEMP/trm-before.sha256"
          sudo sh "$installer" --version "$RELEASE_TAG" --no-start
          sudo sha256sum --check "$RUNNER_TEMP/trm-before.sha256"
          backup=$(sudo find /var/backups/tokenresetsmonitor -mindepth 1 -maxdepth 1 -type d -print | sort | tail -n 1)
          test -n "$backup"
          sudo test -s "$backup/data/state.db"
          test "$(tokenresetsmonitor version --json | jq -r .version)" = "${RELEASE_TAG#v}"
          mkdir -p "$RUNNER_TEMP/trm-candidate"
          cp /usr/local/bin/tokenresetsmonitor "$RUNNER_TEMP/trm-candidate/tokenresetsmonitor"
          sudo systemctl start tokenresetsmonitor
          sleep 2
          sudo systemctl is-active --quiet tokenresetsmonitor
          sudo tokenresetsmonitor status --json --config /etc/tokenresetsmonitor/config.yaml |
            jq -e --arg expected "${RELEASE_TAG#v}" '.running and .runtime.version == $expected and .runtime.state_schema_version == 2'
          sudo systemctl stop tokenresetsmonitor
          migration_backup=$(sudo find /var/lib/tokenresetsmonitor -maxdepth 1 -name 'state.db.backup-*' -type f -print)
          test "$(printf '%s\n' "$migration_backup" | wc -l)" -eq 1
          sudo test -s "$migration_backup"
          sudo sha256sum /var/lib/tokenresetsmonitor/state.db | tee "$RUNNER_TEMP/trm-migrated.sha256"
          if refusal=$(sudo "$RUNNER_TEMP/trm-previous/tokenresetsmonitor" run --once --config /etc/tokenresetsmonitor/config.yaml 2>&1); then
            echo 'Previous binary unexpectedly accepted migrated schema 2.' >&2
            exit 1
          fi
          printf '%s\n' "$refusal" > "$RUNNER_TEMP/trm-schema-refusal.txt"
          grep -Fq 'state schema 2 is newer than supported schema 1' "$RUNNER_TEMP/trm-schema-refusal.txt"
          sudo sha256sum --check "$RUNNER_TEMP/trm-migrated.sha256"
          tokenresetsmonitor version
          # Explicit rollback uses the installer's real backup, including its
          # old executable, configuration, database and operational snapshot.
          sudo install -m 755 "$backup/tokenresetsmonitor" /usr/local/bin/tokenresetsmonitor
          sudo cp -p "$backup/config.yaml" /etc/tokenresetsmonitor/config.yaml
          sudo cp -p "$backup/data/state.db" /var/lib/tokenresetsmonitor/state.db
          sudo cp -p "$backup/data/state.db.status.json" /var/lib/tokenresetsmonitor/state.db.status.json
          sudo sha256sum --check "$RUNNER_TEMP/trm-before.sha256"
          test "$(tokenresetsmonitor version --json | jq -r .version)" = "${PREVIOUS_REF#v}"
          sudo tokenresetsmonitor config validate --config /etc/tokenresetsmonitor/config.yaml
          sudo systemctl start tokenresetsmonitor
          sleep 2
          sudo systemctl is-active --quiet tokenresetsmonitor
          sudo tokenresetsmonitor status --json --config /etc/tokenresetsmonitor/config.yaml
          sudo systemctl stop tokenresetsmonitor
          echo "Published $RELEASE_TAG installer upgraded source-built $PREVIOUS_REF and its backup restored the previous working service."
      - name: Preserve a pending delivery across binary upgrade and rollback
        env:
          TRM_ACCEPTANCE_OLD_BINARY: ${{ runner.temp }}/trm-previous/tokenresetsmonitor
          TRM_ACCEPTANCE_NEW_BINARY: ${{ runner.temp }}/trm-candidate/tokenresetsmonitor
        run: go test -count=1 -v -timeout 2m ./internal/monitor -run TestBinaryUpgradeRollbackAcceptance
      - name: Show service diagnostics
        if: always()
        run: sudo journalctl -u tokenresetsmonitor --no-pager -n 50 || true

  windows:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ inputs.version }}
      PREVIOUS_REF: ${{ inputs.previous_ref }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate version references
        shell: pwsh
        run: |
          foreach ($value in @($env:RELEASE_TAG, $env:PREVIOUS_REF)) {
            if ($value -notmatch '^v\d+\.\d+\.\d+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$') { throw 'Invalid version reference.' }
          }
          if ($env:RELEASE_TAG -eq $env:PREVIOUS_REF) { throw 'Choose distinct previous and candidate versions.' }
      - name: Check out the previous version source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.previous_ref }}
          path: previous-source
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: previous-source/go.mod
          cache-dependency-path: previous-source/go.sum
      - name: Build the exact previous source revision
        working-directory: previous-source
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP 'trm-previous'
          New-Item -ItemType Directory -Path $target -Force | Out-Null
          $module = 'github.com/DKPlugins/TokenResetsMonitor/internal/buildinfo'
          $commit = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve previous source commit.' }
          $version = $env:PREVIOUS_REF.Substring(1)
          Write-Host "Previous source: $env:PREVIOUS_REF at $commit (built in this acceptance job)"
          go build -trimpath -ldflags "-X $module.Version=$version -X $module.Commit=$commit" -o (Join-Path $target 'tokenresetsmonitor.exe') ./cmd/tokenresetsmonitor
          if ($LASTEXITCODE -ne 0) { throw 'Cannot build previous source.' }
      - name: Download the published installer
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$') { throw 'Invalid release tag.' }
          $target = Join-Path $env:RUNNER_TEMP 'trm-installer-acceptance'
          New-Item -ItemType Directory -Path $target -Force | Out-Null
          gh release download $env:RELEASE_TAG --pattern install.ps1 --dir $target
          if ($LASTEXITCODE -ne 0) { throw 'Cannot download published installer.' }
      - name: Reject a tampered release archive
        shell: pwsh
        run: ./scripts/test-installer-checksum.ps1 -Installer (Join-Path $env:RUNNER_TEMP 'trm-installer-acceptance/install.ps1') -Version $env:RELEASE_TAG
      - name: Install, upgrade the previous binary, and restore its backup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:RUNNER_TEMP 'trm-installer-acceptance/install.ps1'
          $installDir = Join-Path $env:RUNNER_TEMP 'TRM acceptance binary'
          $dataDir = Join-Path $env:RUNNER_TEMP 'TRM acceptance data'
          $env:TRM_API_BASE_URL = 'http://127.0.0.1:1/api/v1'
          & $installer -Version $env:RELEASE_TAG -InstallDir $installDir -DataDir $dataDir -NoStart
          $binary = Join-Path $installDir 'tokenresetsmonitor.exe'
          $config = Join-Path $dataDir 'config.yaml'
          $state = Join-Path $dataDir 'data/state.db'
          function Assert-ServiceConfigurationAccess {
            $acl = Get-Acl -LiteralPath $config
            if (-not $acl.AreAccessRulesProtected) { throw 'Configuration inherited broad permissions.' }
            $rules = @($acl.Access | Where-Object { $_.IdentityReference.Translate([Security.Principal.SecurityIdentifier]).Value -eq 'S-1-5-19' })
            if ($rules.Count -ne 1 -or ($rules[0].FileSystemRights -band [Security.AccessControl.FileSystemRights]::Read) -ne [Security.AccessControl.FileSystemRights]::Read) { throw 'LocalService lacks configuration Read.' }
            if (($rules[0].FileSystemRights -band [Security.AccessControl.FileSystemRights]::WriteData) -ne 0) { throw 'LocalService may write configuration.' }
          }
          Assert-ServiceConfigurationAccess
          if ((Get-CimInstance Win32_Service -Filter "Name='TokenResetsMonitor'").StartName -ne 'NT AUTHORITY\LocalService') { throw 'Unexpected service account.' }
          $previousBinary = Join-Path $env:RUNNER_TEMP 'trm-previous/tokenresetsmonitor.exe'
          $legacyConfig = Join-Path $env:RUNNER_TEMP 'trm-previous/config.yaml'
          $env:TRM_STATE_PATH = $state
          $env:TRM_LOGGING_FORMAT = 'json'
          $env:TRM_LOGGING_FILE_ENABLED = 'true'
          $env:TRM_LOGGING_DIRECTORY = Join-Path $dataDir 'logs'
          try {
            & $previousBinary init --defaults --config $legacyConfig
            if ($LASTEXITCODE -ne 0) { throw 'Previous configuration initialization failed.' }
          } finally {
            foreach ($name in @('TRM_STATE_PATH', 'TRM_LOGGING_FORMAT', 'TRM_LOGGING_FILE_ENABLED', 'TRM_LOGGING_DIRECTORY')) {
              Remove-Item -LiteralPath ('Env:\' + $name) -ErrorAction SilentlyContinue
            }
          }
          # Write into the existing protected file without replacing its service ACL.
          [IO.File]::WriteAllBytes($config, [IO.File]::ReadAllBytes($legacyConfig))
          if (-not (Select-String -LiteralPath $config -Pattern '^config_version: 1$' -Quiet)) { throw 'Expected legacy configuration schema 1.' }
          New-ItemProperty -LiteralPath 'HKLM:\SYSTEM\CurrentControlSet\Services\TokenResetsMonitor' -Name Environment -PropertyType MultiString -Value @('TRM_UPDATES_ENABLED=false') -Force | Out-Null
          & $binary config validate --structural --config $config
          if ($LASTEXITCODE -ne 0) { throw 'Candidate structural validation rejected legacy configuration.' }
          Copy-Item -LiteralPath $previousBinary -Destination $binary -Force
          $previousVersion = & $binary version --json | ConvertFrom-Json
          if ($previousVersion.version -ne $env:PREVIOUS_REF.Substring(1)) { throw 'Unexpected previous binary version.' }
          & $binary config validate --config $config
          if ($LASTEXITCODE -ne 0) { throw 'Previous binary rejected its own configuration.' }
          & $binary service start
          if ($LASTEXITCODE -ne 0) { throw 'Service start failed.' }
          Start-Sleep -Seconds 2
          if ((Get-Service TokenResetsMonitor).Status -ne 'Running') { throw 'Service is not running.' }
          & $binary service stop
          if ($LASTEXITCODE -ne 0) { throw 'Service stop failed.' }
          $beforeConfig = (Get-FileHash -LiteralPath $config -Algorithm SHA256).Hash
          $beforeState = (Get-FileHash -LiteralPath $state -Algorithm SHA256).Hash
          & $installer -Version $env:RELEASE_TAG -InstallDir $installDir -DataDir $dataDir -NoStart
          if ((Get-FileHash -LiteralPath $config -Algorithm SHA256).Hash -ne $beforeConfig) { throw 'Update changed configuration.' }
          if ((Get-FileHash -LiteralPath $state -Algorithm SHA256).Hash -ne $beforeState) { throw 'Update changed stopped state.' }
          Assert-ServiceConfigurationAccess
          $backup = Get-ChildItem -LiteralPath (Join-Path $dataDir 'backups') -Directory | Sort-Object Name | Select-Object -Last 1
          if ($null -eq $backup -or -not (Test-Path -LiteralPath (Join-Path $backup.FullName 'data/state.db'))) { throw 'State backup is missing.' }
          $candidateVersion = & $binary version --json | ConvertFrom-Json
          if ($candidateVersion.version -ne $env:RELEASE_TAG.Substring(1)) { throw 'Unexpected candidate binary version.' }
          $candidateDir = Join-Path $env:RUNNER_TEMP 'trm-candidate'
          New-Item -ItemType Directory -Path $candidateDir -Force | Out-Null
          Copy-Item -LiteralPath $binary -Destination (Join-Path $candidateDir 'tokenresetsmonitor.exe')
          & $binary service start
          if ($LASTEXITCODE -ne 0) { throw 'Restart failed.' }
          Start-Sleep -Seconds 2
          if ((Get-Service TokenResetsMonitor).Status -ne 'Running') { throw 'Updated service is not running.' }
          $status = & $binary status --json --config $config | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or -not $status.running -or $status.runtime.state_schema_version -ne 2 -or $status.runtime.version -ne $env:RELEASE_TAG.Substring(1)) { throw 'Candidate did not publish migrated schema 2.' }
          & $binary service stop
          if ($LASTEXITCODE -ne 0) { throw 'Updated service stop failed.' }
          $migrationBackups = @(Get-ChildItem -LiteralPath (Split-Path $state -Parent) -Filter 'state.db.backup-*' -File)
          if ($migrationBackups.Count -ne 1 -or $migrationBackups[0].Length -eq 0) { throw 'Automatic pre-migration backup is missing.' }
          $migratedHash = (Get-FileHash -LiteralPath $state -Algorithm SHA256).Hash
          $refusalPath = Join-Path $env:RUNNER_TEMP 'trm-schema-refusal.txt'
          try {
            $ErrorActionPreference = 'Continue'
            & $previousBinary run --once --config $config *> $refusalPath
            $refusalExit = $LASTEXITCODE
          } finally { $ErrorActionPreference = 'Stop' }
          if ($refusalExit -ne 1 -or [IO.File]::ReadAllText($refusalPath) -notmatch 'state schema 2 is newer than supported schema 1') { throw 'Previous binary did not refuse migrated schema 2.' }
          if ((Get-FileHash -LiteralPath $state -Algorithm SHA256).Hash -ne $migratedHash) { throw 'Previous binary modified unsupported state.' }
          & $binary version
          Copy-Item -LiteralPath (Join-Path $backup.FullName 'tokenresetsmonitor.exe') -Destination $binary -Force
          Copy-Item -LiteralPath (Join-Path $backup.FullName 'config.yaml') -Destination $config -Force
          Copy-Item -LiteralPath (Join-Path $backup.FullName 'data/state.db') -Destination $state -Force
          Copy-Item -LiteralPath (Join-Path $backup.FullName 'data/state.db.status.json') -Destination ($state + '.status.json') -Force
          if ((Get-FileHash -LiteralPath $config -Algorithm SHA256).Hash -ne $beforeConfig) { throw 'Rollback did not restore original configuration.' }
          if ((Get-FileHash -LiteralPath $state -Algorithm SHA256).Hash -ne $beforeState) { throw 'Rollback did not restore original state.' }
          Assert-ServiceConfigurationAccess
          $restoredVersion = & $binary version --json | ConvertFrom-Json
          if ($restoredVersion.version -ne $env:PREVIOUS_REF.Substring(1)) { throw 'Rollback did not restore the previous binary.' }
          & $binary service start
          if ($LASTEXITCODE -ne 0) { throw 'Rolled-back service start failed.' }
          Start-Sleep -Seconds 2
          if ((Get-Service TokenResetsMonitor).Status -ne 'Running') { throw 'Rolled-back service is not running.' }
          & $binary service stop
          if ($LASTEXITCODE -ne 0) { throw 'Rolled-back service stop failed.' }
          & $binary service uninstall
          if ($LASTEXITCODE -ne 0) { throw 'Service uninstall failed.' }
          if (-not (Test-Path -LiteralPath $config) -or -not (Test-Path -LiteralPath $state)) { throw 'Uninstall deleted persistent data.' }
          Write-Host "Published $env:RELEASE_TAG installer upgraded source-built $env:PREVIOUS_REF and its backup restored the previous working service."
      - name: Preserve a pending delivery across binary upgrade and rollback
        env:
          TRM_ACCEPTANCE_OLD_BINARY: ${{ runner.temp }}/trm-previous/tokenresetsmonitor.exe
          TRM_ACCEPTANCE_NEW_BINARY: ${{ runner.temp }}/trm-candidate/tokenresetsmonitor.exe
        run: go test -count=1 -v -timeout 2m ./internal/monitor -run TestBinaryUpgradeRollbackAcceptance
      - name: Show service diagnostics
        if: always()
        shell: pwsh
        run: |
          try {
            Get-WinEvent -FilterHashtable @{ LogName = 'Application'; ProviderName = 'TokenResetsMonitor' } -MaxEvents 20 -ErrorAction Stop | Format-List TimeCreated, Message
          } catch {
            Write-Host 'No TokenResetsMonitor Event Log entries are available.'
          }
          exit 0

  published-container:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.version }}
    steps:
      - name: Use an empty Docker credential directory
        run: |
          printf '%s\n' "$RELEASE_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$'
          docker_config="$RUNNER_TEMP/trm-public-docker"
          mkdir -p "$docker_config"
          test ! -e "$docker_config/config.json"
          echo "DOCKER_CONFIG=$docker_config" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
      - name: Pull publicly and run both published architectures
        run: |
          image="ghcr.io/dkplugins/tokenresetsmonitor:$RELEASE_TAG"
          for arch in amd64 arm64; do
            docker pull --platform "linux/$arch" "$image"
            docker run --rm --platform "linux/$arch" --read-only --network none "$image" version --json > version.json
            jq -e --arg expected "${RELEASE_TAG#v}" '.version == $expected and .commit != "development"' version.json
            docker run --rm --platform "linux/$arch" --read-only --network none --entrypoint sh "$image" -c 'test "$(id -u)" = 10001'
          done

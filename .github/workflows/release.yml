name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Refuse to replace an existing release or container tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          printf '%s\n' "$RELEASE_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$'
          status=$(curl --silent --show-error --connect-timeout 10 --max-time 30 \
            --output "$RUNNER_TEMP/trm-existing-release.json" --write-out '%{http_code}' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/$RELEASE_TAG")
          case "$status" in
            200) echo 'A release already exists for this tag; publish a new version.' >&2; exit 1 ;;
            404) ;;
            *) echo 'Cannot verify release tag absence; refusing to publish.' >&2; exit 1 ;;
          esac
          # Authenticate once to resolve private or public GHCR tags consistently.
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          if docker manifest inspect "ghcr.io/dkplugins/tokenresetsmonitor:$RELEASE_TAG" >"$RUNNER_TEMP/trm-manifest.json" 2>"$RUNNER_TEMP/trm-manifest.error"; then
            echo 'A container tag already exists; publish a new version.' >&2
            exit 1
          elif ! grep -Eiq '(no such manifest|manifest unknown)' "$RUNNER_TEMP/trm-manifest.error"; then
            echo 'Cannot verify container tag absence; refusing to publish.' >&2
            exit 1
          fi
      - name: Build release archives
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          sh scripts/release.sh "$RELEASE_TAG"
          python3 scripts/verify-release.py "dist/$RELEASE_TAG"
      - name: Prepare image metadata
        id: metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/dkplugins/tokenresetsmonitor:${{ github.ref_name }}
          build-args: |
            VERSION=${{ steps.metadata.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.metadata.outputs.date }}
          labels: |
            org.opencontainers.image.source=https://github.com/DKPlugins/TokenResetsMonitor
            org.opencontainers.image.version=${{ steps.metadata.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set --
          case "$RELEASE_TAG" in *-*) set -- --prerelease ;; esac
          gh release create "$RELEASE_TAG" \
            "dist/$RELEASE_TAG/"*.tar.gz "dist/$RELEASE_TAG/"*.zip \
            "dist/$RELEASE_TAG/compatibility.json" "dist/$RELEASE_TAG/checksums.txt" "dist/$RELEASE_TAG/install.sh" "dist/$RELEASE_TAG/install.ps1" \
            --draft --verify-tag --title "TokenResetsMonitor $RELEASE_TAG" --generate-notes "$@"
          # Attach every artifact before publication makes this release immutable.
          gh release edit "$RELEASE_TAG" --draft=false

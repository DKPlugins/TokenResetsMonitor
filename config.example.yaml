# Public announcements, not personal account usage.
# Operational YAML changes reload automatically; infrastructure changes need restart.
config_version: 3
api_base_url: https://tokenresets.com/api/v1
poll_interval: 30m
request_timeout: 30s
state_path: ./data/state.db
history:
  # 0 keeps detailed history indefinitely; a positive number prunes old detail.
  retention_days: 0
providers:
  - slug: openai-codex
    plans: []
    products: []
    windows: []
  - slug: anthropic-claude
    plans: []
    products: []
    windows: []
event_types: [hard_reset]
minimum_confidence: reported
unknown_scope: include
webhook:
  enabled: false
  # Opt in after teaching the receiver about correction/withdrawal notifications.
  notify_changes: false
  url: ""
  method: POST
  headers: {}
  # Example: Authorization: "Bearer ${WEBHOOK_TOKEN}"
  # Empty template sends the versioned JSON notification.
  body_template: ""
  timeout: 15s
telegram:
  # Run: tokenresetsmonitor setup telegram --config ./config.yaml
  enabled: false
  notify_changes: true
  bot_token: ""
  chat_id: ""
  message_thread_id: 0
  disable_notification: false
  timeout: 15s
  api_base_url: https://api.telegram.org
slack:
  # Run: tokenresetsmonitor setup slack --config ./config.yaml
  enabled: false
  notify_changes: true
  # Prefer "${SLACK_WEBHOOK_URL}" with the secret in your service environment.
  webhook_url: ""
  timeout: 15s
reload:
  enabled: true
observability:
  # Trusted local access only. Listener changes require a restart.
  enabled: false
  listen: 127.0.0.1:9090
updates:
  # Read-only GitHub release checks. No automatic download or installation.
  enabled: true
  interval: 24h
  include_prerelease: false
logging:
  level: info
  format: text
  file_enabled: false
  directory: ./logs
  max_size_mb: 10
  max_backups: 5
  max_age_days: 14
